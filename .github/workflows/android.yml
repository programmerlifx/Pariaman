name: Build The Lifx APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          mkdir -p "$HOME/android-sdk"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

          curl -fsSL \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o /tmp/android-tools.zip

          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools

          mv /tmp/android-tools/cmdline-tools/* \
            "$HOME/android-sdk/cmdline-tools/latest/"

          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$HOME/android-sdk" --licenses

          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$HOME/android-sdk" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: the-lifx-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
